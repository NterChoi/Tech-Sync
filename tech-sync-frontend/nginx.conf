# Tech-Sync 프론트엔드 nginx — 정적 SPA 서빙 + 백엔드 리버스 프록시
# 프론트와 API/WS 를 같은 오리진(80)으로 묶어 CORS 를 제거한다.
# upstream 호스트 'backend' 는 docker-compose.prod.yml 의 서비스명이다.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── SSE 알림 (Phase 3) — 장기 연결, 버퍼링 비활성화 ──────────
    # /api/ 보다 prefix 가 길어 nginx 가 우선 매칭한다.
    location /api/alarm/subscribe {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # ── REST API ────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── WebSocket / SockJS (STOMP 공동편집·커서) ─────────────────
    location /ws/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }

    # ── SPA fallback ────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
