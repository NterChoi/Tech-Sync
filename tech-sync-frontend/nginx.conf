# Tech-Sync 프론트엔드 nginx — HTTPS(443) 정적 SPA 서빙 + 백엔드 리버스 프록시
# 80 = ACME(Let's Encrypt) 챌린지 + HTTPS 강제 리다이렉트, 실제 서비스는 443(ssl).
# 프론트와 API/WS 를 같은 오리진(443)으로 묶어 CORS 를 제거한다.
# upstream 호스트 'backend' 는 docker-compose.prod.yml 의 서비스명이다.

# ── HTTP(80): ACME 챌린지 + HTTPS 리다이렉트 ────────────────────
server {
    listen 80;
    server_name techsync.cloud www.techsync.cloud;

    # Let's Encrypt webroot 갱신 챌린지 (인증서 발급/갱신용)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 그 외 모든 요청은 HTTPS 로 영구 리다이렉트
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS(443): 실제 서비스 ────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name techsync.cloud www.techsync.cloud;

    ssl_certificate     /etc/letsencrypt/live/techsync.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/techsync.cloud/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;

    root /usr/share/nginx/html;
    index index.html;

    # ── SSE 알림 (Phase 3) — 장기 연결, 버퍼링 비활성화 ──────────
    # /api/ 보다 prefix 가 길어 nginx 가 우선 매칭한다.
    location /api/alarm/subscribe {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # ── REST API ────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── WebSocket / SockJS (STOMP 공동편집·커서) ─────────────────
    location /ws/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # ── SPA fallback ────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
